version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: khelniti-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: khelniti
      POSTGRES_PASSWORD: khelniti
      POSTGRES_DB: khelniti
    ports:
      - "5432:5432"
    volumes:
      - khelniti_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U khelniti"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: khelniti-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://khelniti:khelniti@postgres:5432/khelniti
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        NEXT_PUBLIC_WS_BASE_URL: ws://localhost:8000
    container_name: khelniti-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  khelniti_pg_data:
